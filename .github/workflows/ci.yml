name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Keep CI data separate from any local .data/pg and start from an empty DB.
      PGLITE_DATA_DIR: .data/ci-pg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Fullstack scenarios test
        run: npx tsx scripts/test-fullstack-scenarios.ts

      - name: Billing & Plans test
        run: npx tsx scripts/test-billing-feature.ts

      - name: Telegram integration test
        run: npx tsx scripts/test-telegram-production.ts

      - name: Payments lifecycle test
        run: npx tsx scripts/test-payments-lifecycle.ts

      - name: REST API v1 test
        run: npx tsx scripts/test-api-v1.ts

      - name: Mobile app logic test
        run: npx tsx scripts/test-mobile-app.ts

      - name: Next.js Production Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
