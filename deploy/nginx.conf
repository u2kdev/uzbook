# Example nginx site for uzbook. Adjust the domain and certificate paths.
# Put this in /etc/nginx/sites-available/uzbook and symlink it into sites-enabled.
#
# The app container publishes 127.0.0.1:3000 in docker-compose.yml, so nginx on
# the host is the only public entry point.

limit_req_zone $binary_remote_addr zone=uzbook_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name uzbook.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name uzbook.online;

    ssl_certificate     /etc/letsencrypt/live/uzbook.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzbook.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gallery uploads accept an "after" and a "before" photo (5 MB each).
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/payments/ {
        limit_req zone=uzbook_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
